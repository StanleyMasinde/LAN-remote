<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#eef2ff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0f172a"
    />
    <title>YouTube Remote</title>

    <style>
      :root {
        --bg: #eef2ff;
        --surface: #ffffff;
        --card: #dbe4f5;
        --card-2: #e7eefb;
        --text: #0f172a;
        --muted: #475569;
        --remote-start: #f8fbff;
        --cluster-bg: rgba(255, 255, 255, 0.72);
        --cluster-border: rgba(71, 85, 105, 0.18);
        --nav-bg-start: rgba(219, 228, 245, 0.92);
        --nav-bg-end: rgba(231, 238, 251, 0.96);
        --nav-border: rgba(71, 85, 105, 0.22);
        --panel-gap: clamp(0.5rem, 1.4vh, 0.9rem);
        color-scheme: light dark;

        @media (prefers-color-scheme: dark) {
          --bg: #0f172a;
          --surface: #111a2d;
          --card: #1e293b;
          --card-2: #27354d;
          --text: #e2e8f0;
          --muted: #94a3b8;
          --remote-start: #17233b;
          --cluster-bg: rgba(30, 41, 59, 0.55);
          --cluster-border: rgba(148, 163, 184, 0.12);
          --nav-bg-start: rgba(39, 53, 77, 0.65);
          --nav-bg-end: rgba(30, 41, 59, 0.85);
          --nav-border: rgba(148, 163, 184, 0.2);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100dvh;
        overflow: auto;
      }

      header {
        text-align: center;
        padding: clamp(0.5rem, 2vh, 0.9rem);
        color: var(--muted);
      }

      .app-title {
        margin: 0;
        font-size: 1rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 600;
        text-wrap: balance;

        @media (max-width: 380px) {
          font-size: 0.92rem;
        }
      }

      main {
        min-height: 0;
        display: grid;
        place-items: center;
        padding: 0 clamp(0.75rem, 3vw, 1rem);
        container-type: inline-size;
      }

      .remote {
        width: min(100%, 380px);
        max-height: 100%;
        border-radius: 28px;
        padding: clamp(0.6rem, 1.8vh, 1rem);
        background: linear-gradient(
          165deg,
          var(--remote-start) 0%,
          var(--surface) 100%
        );
        border: 1px solid rgba(148, 163, 184, 0.18);
        display: grid;
        gap: var(--panel-gap);

        @media (max-height: 760px) {
          gap: 0.5rem;
          padding: 0.55rem;
        }

        @container (max-width: 420px) {
          border-radius: 22px;
        }
      }

      .cluster {
        background: var(--cluster-bg);
        border: 1px solid var(--cluster-border);
        border-radius: 18px;
        padding: clamp(0.4rem, 1.1vh, 0.65rem);

        @media (max-height: 760px) {
          padding: 0.38rem;
        }
      }

      .cluster-title {
        margin: 0 0 0.4rem;
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        text-align: center;
        text-wrap: balance;

        @media (max-width: 380px) {
          font-size: 0.62rem;
        }

        @media (max-height: 760px) {
          margin-bottom: 0.22rem;
          font-size: 0.58rem;
        }
      }

      button {
        border: none;
        border-radius: 14px;
        background: linear-gradient(180deg, var(--card-2) 0%, var(--card) 100%);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 120ms ease,
          box-shadow 120ms ease,
          filter 120ms ease;

        &:active {
          transform: scale(0.97);
          box-shadow: inset 0 0 0 2px
            color-mix(in srgb, var(--muted) 35%, transparent);

          @media (prefers-reduced-motion: reduce) {
            transform: none;
          }
        }

        &.is-pressed {
          transform: scale(0.97);
          box-shadow: inset 0 0 0 2px
            color-mix(in srgb, var(--muted) 40%, transparent);
          filter: brightness(0.95);
        }

        &:focus-visible {
          outline: 2px solid color-mix(in srgb, var(--text) 70%, transparent);
          outline-offset: 2px;
        }

        svg {
          width: 20px;
          height: 20px;
        }
      }

      .media-pad {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: clamp(8px, 1.6vw, 10px);

        button {
          min-height: clamp(42px, 6.2vh, 58px);
        }

        .play {
          min-height: clamp(44px, 6.8vh, 62px);
        }

        @media (max-height: 760px) {
          gap: 6px;
        }
      }

      .track-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;

        button {
          min-height: clamp(44px, 5.5vh, 48px);
          font-size: clamp(0.78rem, 2.8vw, 0.86rem);
        }

        @media (max-height: 760px) {
          gap: 6px;
        }
      }

      button kbd {
        font-family: inherit;
        font-size: 0.68rem;
        font-weight: 700;
        line-height: 1;
        color: var(--muted);
        border: 1px solid var(--cluster-border);
        border-radius: 6px;
        padding: 3px 6px;
      }

      footer {
        text-align: center;
        padding: clamp(0.2rem, 0.9vh, 0.45rem);
        font-size: 0.72rem;
        color: var(--muted);
      }

      footer a {
        color: inherit;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1 class="app-title">YouTube Remote</h1>
    </header>

    <main>
      <section class="remote" aria-label="YouTube remote controls">
        <section class="cluster" aria-labelledby="playback-heading">
          <h2 id="playback-heading" class="cluster-title">Playback</h2>
          <div class="media-pad">
            <button data-key="j" aria-label="Back 10 seconds">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M6.75 6.75v10.5" />
                <path d="m17.25 7.5-7.5 4.5 7.5 4.5v-9Z" />
              </svg>
              <kbd>J</kbd>
            </button>
            <button class="play" data-key="k" aria-label="Play or pause">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m5.25 5.25 7.5 6.75-7.5 6.75V5.25Z" />
                <path d="M16.5 6.75v10.5" />
                <path d="M19.5 6.75v10.5" />
              </svg>
              <kbd>K</kbd>
            </button>
            <button data-key="l" aria-label="Forward 10 seconds">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M17.25 6.75v10.5" />
                <path d="m6.75 7.5 7.5 4.5-7.5 4.5v-9Z" />
              </svg>
              <kbd>L</kbd>
            </button>
          </div>
        </section>

        <section class="cluster" aria-labelledby="youtube-heading">
          <h2 id="youtube-heading" class="cluster-title">YouTube</h2>
          <div class="track-row">
            <button data-key="f" aria-label="Toggle fullscreen">
              Full screen
              <kbd>F</kbd>
            </button>
            <button data-key="t" aria-label="Toggle theater mode">
              Theatre
              <kbd>T</kbd>
            </button>
            <button data-key="c" aria-label="Toggle captions">
              Captions
              <kbd>C</kbd>
            </button>
            <button data-key="i" aria-label="Toggle miniplayer">
              Mini-player
              <kbd>I</kbd>
            </button>
            <button data-key="m" aria-label="Mute YouTube player">
              Mute
              <kbd>M</kbd>
            </button>
            <button data-key="/" aria-label="Focus search">
              Search
              <kbd>/</kbd>
            </button>
          </div>
        </section>

        <section class="cluster" aria-labelledby="track-heading">
          <h2 id="track-heading" class="cluster-title">Playlist</h2>
          <div class="track-row">
            <button data-key="P" aria-label="Previous video">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m13.5 6.75-5.25 5.25 5.25 5.25" />
                <path d="m19.5 6.75-5.25 5.25 5.25 5.25" />
              </svg>
              Prev
              <kbd>⇧ P</kbd>
            </button>
            <button data-key="N" aria-label="Next video">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m10.5 6.75 5.25 5.25-5.25 5.25" />
                <path d="m4.5 6.75 5.25 5.25-5.25 5.25" />
              </svg>
              Next
              <kbd>⇧ N</kbd>
            </button>
          </div>
        </section>
      </section>
    </main>

    <footer>LAN only · <a href="/">Back to main remote</a></footer>

    <script type="module">
      const remote = document.querySelector(".remote");

      async function sendKey(key) {
        try {
          await fetch("/custom", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ key }),
            signal: AbortSignal.timeout(3000),
          });
        } catch (error) {
          console.error(`Failed to send key "${key}":`, error);
        }
      }

      function flashPressed(button) {
        button.classList.add("is-pressed");
        setTimeout(() => button.classList.remove("is-pressed"), 140);
      }

      remote.addEventListener("pointerdown", (event) => {
        event.target.closest("button")?.classList.add("is-pressed");
      });

      remote.addEventListener("pointerup", (event) => {
        event.target.closest("button")?.classList.remove("is-pressed");
      });

      for (const type of ["pointercancel", "pointerleave"]) {
        remote.addEventListener(type, (event) => {
          event.target.closest("button")?.classList.remove("is-pressed");
        });
      }

      remote.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-key]");
        if (!button) return;

        flashPressed(button);
        sendKey(button.dataset.key);
      });

      remote.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.target.closest("button")?.classList.add("is-pressed");
      });

      remote.addEventListener("keyup", (event) => {
        event.target.closest("button")?.classList.remove("is-pressed");
      });
    </script>
  </body>
</html>
